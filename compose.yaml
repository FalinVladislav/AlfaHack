services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_demo_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit -d credit"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ./backend
      target: production
    environment:
      DB_URL: jdbc:postgresql://db:5432/credit
      DB_USER: credit
      DB_PASSWORD: ${DB_PASSWORD:-local_demo_password}
      MODEL_API_URL: ${MODEL_API_URL:-}
      MODEL_API_TIMEOUT_SECONDS: ${MODEL_API_TIMEOUT_SECONDS:-30}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      - api
volumes:
  postgres_data:
