services:
  db:
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  api:
    image: ${COMPOSE_PROJECT_NAME:-alfahack}-api-dev
    build:
      context: ./backend
      target: development
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
      - backend_target:/app/target
    command: >-
      sh -c "mvn -B -DskipTests compile || exit $$?;
      touch /tmp/dev-compile.stamp;
      (while true; do
        sleep 2;
        if find src docs pom.xml -type f -newer /tmp/dev-compile.stamp -print -quit | grep -q .; then
          mvn -B -DskipTests compile && touch /tmp/dev-compile.stamp;
        fi;
      done) &
      exec mvn -B -DskipTests spring-boot:run"
    ports: !override
      - "127.0.0.1:${API_PORT:-8080}:8080"

  web:
    image: ${COMPOSE_PROJECT_NAME:-alfahack}-web-dev
    build:
      context: ./frontend
      target: development
    environment:
      API_PROXY: http://api:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports: !override
      - "127.0.0.1:${DEV_WEB_PORT:-5173}:5173"

volumes:
  maven_cache:
  backend_target:
  frontend_node_modules:
