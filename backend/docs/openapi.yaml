          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioDialog'}
  /drafts/{id}/scenario-dialog/messages:
    post:
      summary: Сохранить сообщение и запустить фоновый цикл tools
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
