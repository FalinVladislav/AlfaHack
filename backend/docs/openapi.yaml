                message: {type: string, minLength: 1, maxLength: 4000}
                quote_id: {type: string}
                request_id: {type: string, minLength: 8, maxLength: 80, pattern: '^[a-zA-Z0-9-]+$', description: Идемпотентность отправки; при повторе использовать прежний идентификатор}
      responses:
        '200':
          description: Сохранённый диалог; далее опрашивать GET до IDLE или FAILED
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioDialog'}
        '409': {$ref: '#/components/responses/conflict'}
