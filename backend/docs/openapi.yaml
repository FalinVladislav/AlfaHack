openapi: 3.0.3
info:
  title: Кредитный кабинет — локальный API
  version: 1.1.0
  description: |
    Сначала выполните POST /auth/sessions с логином stable, gap или staff и паролем Alfa2026!.
    Браузер сохраняет HttpOnly cookie cabinet_session. Swagger UI автоматически получает
    CSRF-токен из ответа входа или GET /me и передаёт X-CSRF-Token в изменяющих запросах.
    После перезагрузки Swagger UI существующая сессия продолжает работать.
    Для операций с Idempotency-Key указывайте уникальный ключ для нового действия;
    при повторе того же действия используйте прежний ключ.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cabinet_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Swagger UI подставляет токен текущей сессии автоматически.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    requestId:
      name: requestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    key:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
  schemas:
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
    DraftPatch:
      type: object
      required: [expected_version]
      properties:
        expected_version: {type: integer}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        amount: {type: string, example: '3000000.00'}
        term_months: {type: integer, nullable: true}
        duration_days: {type: integer, nullable: true}
        needed_by: {type: string, format: date}
    Submit:
      type: object
      required: [draft_id, expected_version, quote_id, consents]
      properties:
        draft_id: {type: string, format: uuid}
        expected_version: {type: integer}
        quote_id: {type: string, format: uuid}
        consents: {type: boolean}
    AnyObject:
      type: object
      additionalProperties: true
  responses:
    Error:
      description: Ошибка авторизации или доступа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ok:
      description: Серверное состояние объекта или результат действия
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AnyObject'}
    conflict:
      description: Конфликт версии или состояния
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
security:
  - sessionCookie: []
paths:
  /finance/overview:
    get:
      summary: Финансовый профиль компании, операции, остатки и синтетические потребности
      description: Только для клиента. Данные ограничены компанией текущей сессии. months содержит доходы, расходы и чистый поток по завершённым месяцам.
      responses:
        '200':
          description: Финансовая сводка
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: {type: object}
                  months: {type: array, items: {type: object}}
                  transactions: {type: array, items: {type: object}}
                  balances: {type: array, items: {type: object}}
                  loans: {type: array, items: {type: object}}
                  products: {type: array, items: {type: object}}
                  needs: {type: array, items: {type: object}}
                  data_origin: {type: string, enum: [SYNTHETIC]}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/loans:
    get:
      summary: Действующие обязательства и кредиты, выданные через кабинет
      description: Сортировка по ближайшему списанию. source различает EXISTING и ISSUED. end_date рассчитывается от даты фактической выдачи; для старой записи без события выдачи может отсутствовать.
      responses:
        '200':
          description: Кредиты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    company_id: {type: string}
                    name: {type: string}
                    remaining_debt: {type: number}
                    monthly_payment: {type: number}
                    rate: {type: number}
                    next_payment_date: {type: string, format: date}
                    end_date: {type: string, format: date}
                    source: {type: string, enum: [EXISTING, ISSUED]}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/sessions:
    post:
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string, enum: [stable, gap, staff]}
                password: {type: string, format: password}
            example:
              login: stable
              password: Alfa2026!
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '401': {description: Неверный логин или пароль}
  /logout:
    post:
      summary: Завершить сессию
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /me:
    get:
      summary: Текущий аккаунт и CSRF-токен
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /dashboard:
    get:
      summary: Баланс, плановый прогноз и локальные материалы
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /insights:
    get:
      summary: Сценарные рекомендации по синтетическим данным клиента
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /cashflow/summary:
    get:
      summary: Доходы и расходы за шесть завершённых месяцев
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /synthetic/profiles:
    get:
      summary: Семь синтетических отраслевых профилей, доступно сотруднику
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '403': {description: Клиенту недоступно}
  /cashflow/forecast:
    get:
      summary: Плановый прогноз по известным событиям
      parameters:
        - {name: horizon, in: query, schema: {type: string, enum: [30D, 6M]}}
        - {name: scenario, in: query, schema: {type: string, enum: [BASE, STRESS]}}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /products:
    get:
      summary: Каталог учебных продуктов
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /drafts:
    get:
      summary: Черновики своей компании
      responses:
        '200': {$ref: '#/components/responses/ok'}
    post:
      summary: Создать черновик
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /drafts/{id}:
    parameters: [{$ref: '#/components/parameters/id'}]
    get:
      summary: Получить черновик
      responses:
        '200': {$ref: '#/components/responses/ok'}
    patch:
      summary: Изменить черновик с проверкой версии
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftPatch'}
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '409': {$ref: '#/components/responses/conflict'}
  /drafts/{id}/quotes:
    post:
      summary: Рассчитать продукты для версии черновика
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version]
              properties:
                expected_version: {type: integer}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /quotes/{id}/analysis:
    post:
      summary: Сравнить плановый остаток с кредитом и без него
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                horizon: {type: string, enum: [30D, 6M, FULL]}
                scenario: {type: string, enum: [BASE, STRESS]}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications:
    get:
      summary: Доступные заявки
      responses:
        '200': {$ref: '#/components/responses/ok'}
    post:
      summary: Подать заявку
      parameters: [{$ref: '#/components/parameters/key'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Submit'}
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '409': {$ref: '#/components/responses/conflict'}
  /applications/{id}:
    get:
      summary: Заявка, запросы, история и следующее действие
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/checks:
    post:
      summary: Повторить проверки по данным заявителя; завершённое решение возвращается без изменений
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                demo_profile: {type: string, deprecated: true, description: "Необязательно. Чужой профиль отклоняется с PROFILE_LOCKED."}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/documents:
    post:
      summary: Подтвердить сведения подготовленной синтетической выпиской CSV
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request_id, file]
              properties:
                request_id: {type: string, format: uuid}
                file: {type: string, format: binary}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/documents/{documentId}:
    get:
      summary: Скачать документ после проверки доступа
      parameters:
        - {$ref: '#/components/parameters/id'}
        - {name: documentId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Содержимое файла
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /applications/{id}/requests/{requestId}/complete:
    post:
      summary: Продолжить проверку после подтверждения документа
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/requestId'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/offer/accept:
    post:
      summary: Принять версию предложения
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/key'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_version]
              properties:
                offer_version: {type: integer}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/offer/decline:
    post:
      summary: Отклонить предложение
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/contract:
    get:
      summary: Демонстрационный договор
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/contract/sign:
    post:
      summary: Демонстрационная подпись
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/key'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /applications/{id}/disburse:
    post:
      summary: Демонстрационная выдача
      parameters: [{$ref: '#/components/parameters/id'}, {$ref: '#/components/parameters/key'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /loans:
    get:
      summary: Кредиты компании
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /loans/{id}:
    get:
      summary: Кредит компании
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /staff/applications:
    get:
      summary: Очередь сотрудника
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /staff/applications/{id}:
    get:
      summary: Карточка заявки сотрудника
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /assistant/messages:
    post:
      summary: Получить ответ и предложение изменения через API моделей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                draft_id: {type: string, format: uuid}
                quote_id: {type: string, format: uuid}
                application_id: {type: string, format: uuid}
                message: {type: string}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /assistant/proposals/{id}/apply:
    post:
      summary: Применить подтверждённое предложение
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, confirmed]
              properties:
                expected_version: {type: integer}
                confirmed: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/ok'}
