openapi: 3.0.3
info:
  title: Кредитный кабинет — локальный API
  version: 1.1.0
  description: |
    Сначала выполните POST /auth/sessions с логином stable, gap или staff и паролем Alfa2026!.
    Браузер сохраняет HttpOnly cookie cabinet_session. Swagger UI автоматически получает
    CSRF-токен из ответа входа или GET /me и передаёт X-CSRF-Token в изменяющих запросах.
    После перезагрузки Swagger UI существующая сессия продолжает работать.
    Для операций с Idempotency-Key указывайте уникальный ключ для нового действия;
    при повторе того же действия используйте прежний ключ.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cabinet_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Swagger UI подставляет токен текущей сессии автоматически.
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    requestId:
      name: requestId
      in: path
      required: true
      schema: {type: string, format: uuid}
    key:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string}
  schemas:
    ScenarioDialog:
      type: object
      required: [status, messages, plan_version, confirmed_version]
      properties:
        id: {type: string}
        status: {type: string, enum: [NOT_STARTED, IDLE, QUEUED, RUNNING, FAILED]}
        messages:
          type: array
          items:
            type: object
            properties:
              role: {type: string, enum: [user, assistant]}
              content: {type: string}
        plan_version: {type: integer}
        confirmed_version: {type: integer}
        ready_to_prepare: {type: boolean, description: Полный рабочий план готов к восстановлению}
        working_plan_hash: {type: string}
        last_error: {type: string, nullable: true}
        proposed_plan: {type: object, nullable: true, additionalProperties: true, description: Полный план SALES/CASHFLOW; см. business-scenario-dialog.md}
        confirmed_plan: {type: object, nullable: true, additionalProperties: true}
        plan_metrics: {type: object, additionalProperties: true}
    CreditGoal:
      type: object
      properties:
        id: {type: string}
        label: {type: string}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        product_ids: {type: array, items: {type: string}}
    GoalResolution:
      type: object
      required: [status, choices]
      properties:
        status: {type: string, enum: [READY, NEEDS_CLARIFICATION, UNSUPPORTED]}
        goal_id: {type: string}
        goal_text: {type: string}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        purpose_label: {type: string}
        product_ids: {type: array, items: {type: string}}
        source: {type: string, enum: [CATALOG, LLM, RULES]}
        question: {type: string}
        choices:
          type: array
          items:
            type: object
            properties:
              purpose: {type: string}
              label: {type: string}
              product_ids: {type: array, items: {type: string}}
    FinancingLimits:
      type: object
      required: [status, purpose, products, amount_step, basis, note, policy_version]
      properties:
        status: {type: string, enum: [AVAILABLE, INSUFFICIENT_DATA, NO_CAPACITY]}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        amount_step: {type: integer, example: 1000}
        basis: {type: object, additionalProperties: true, description: Обороты, долговые платежи, возраст и количество месяцев истории}
        note: {type: string}
        policy_version: {type: string}
        products:
          type: array
          items:
            type: object
            properties:
              product_id: {type: string}
              name: {type: string}
              term_unit: {type: string, enum: [DAYS, MONTHS]}
              terms:
                type: array
                description: Точный перечень доступных сроков с диапазоном суммы для каждого; календарные ограничения могут оставлять пропуски
                items:
                  type: object
                  properties:
                    term: {type: integer}
                    min_amount: {type: number}
                    max_amount: {type: number}
    HypothesisJob:
      type: object
      required: [id, status, message, updated_at, data_version]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [QUEUED, RUNNING, READY, EMPTY, PARTIAL, FAILED]}
        message: {type: string}
        updated_at: {type: string, format: date-time}
        data_version: {type: string}
    Hypothesis:
      type: object
      required: [id, title, status, rationale, evidence, assumptions, questions, experiment, success_metric, financing, explanation_source]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        status: {type: string, enum: [CALCULATED, NEEDS_DATA, EXPERIMENT_ONLY]}
        highlight: {type: string}
        rationale: {type: string}
        evidence: {type: array, items: {type: object, additionalProperties: true}}
        assumptions: {type: array, items: {type: string}}
        questions: {type: array, items: {type: string}}
        experiment: {type: string}
        success_metric: {type: string}
        explanation_source: {type: string, enum: [LLM, RULES]}
        enrichment_status: {type: string, enum: [UNAVAILABLE]}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        amount: {type: number}
        term_months: {type: integer}
        duration_days: {type: integer}
        needed_by: {type: string, format: date}
        as_of: {type: string, format: date}
        created_at: {type: string, format: date-time}
        data_origin: {type: string}
        stale: {type: boolean, description: Данные изменились; финансирование по старой версии приостановлено в UI}
        financing:
          type: object
          properties:
            status: {type: string, enum: [PRELIMINARY, NO_MATCH]}
            note: {type: string}
            options: {type: array, items: {$ref: '#/components/schemas/HypothesisFinancing'}}
    HypothesisFinancing:
      type: object
      properties:
        product_id: {type: string}
        name: {type: string}
        amount: {type: number}
        annual_rate: {type: number, description: Доля единицы}
        term: {type: integer}
        term_unit: {type: string, enum: [DAYS, MONTHS]}
        monthly_payment: {type: number}
        total_repay: {type: number}
        interest: {type: number}
        assessment: {type: string, enum: [NOT_ASSESSED, PLAN_ONLY, PLAN_SHORTFALL]}
        repayment_date: {type: string, format: date}
        planned_balance_after_repayment: {type: number}
    HypothesisList:
      type: object
      required: [job, cards]
      properties:
        job: {$ref: '#/components/schemas/HypothesisJob'}
        cards: {type: array, items: {$ref: '#/components/schemas/Hypothesis'}}
    HypothesisNotification:
      type: object
      required: [id, title, hypothesis_id, read, created_at]
      properties:
        id: {type: string, format: uuid}
        hypothesis_id: {type: string, format: uuid}
        title: {type: string}
        read: {type: boolean}
        created_at: {type: string, format: date-time}
    Error:
      type: object
      properties:
        code: {type: string}
        message: {type: string}
    DraftPatch:
      type: object
      required: [expected_version]
      properties:
        goal_id: {type: string, nullable: true, description: ID готовой цели или OTHER}
        goal_text: {type: string, nullable: true, minLength: 5, maxLength: 500}
        expected_version: {type: integer}
        purpose: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}
        amount: {type: string, example: '3000000.00'}
        term_months: {type: integer, nullable: true}
        duration_days: {type: integer, nullable: true}
        needed_by: {type: string, format: date}
    Submit:
      type: object
      required: [draft_id, expected_version, quote_id, consents]
      properties:
        draft_id: {type: string, format: uuid}
        expected_version: {type: integer}
        quote_id: {type: string, format: uuid}
        consents: {type: boolean}
    AnyObject:
      type: object
      additionalProperties: true
  responses:
    Error:
      description: Ошибка авторизации или доступа
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ok:
      description: Серверное состояние объекта или результат действия
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AnyObject'}
    conflict:
      description: Конфликт версии или состояния
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
security:
  - sessionCookie: []
paths:
  /finance/summary:
    get:
      summary: Краткая финансовая сводка для клиентского кабинета
      description: Компания, месячные суммы, кредиты, продукты и потребности без полного массива операций. История запрашивается через /finance/activity.
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/overview:
    get:
      summary: Финансовый профиль компании, операции, остатки и синтетические потребности
      description: Только для клиента. Данные ограничены компанией текущей сессии. months содержит доходы, расходы и чистый поток по завершённым месяцам.
      responses:
        '200':
          description: Финансовая сводка
          content:
            application/json:
              schema:
                type: object
                properties:
                  company: {type: object}
                  months: {type: array, items: {type: object}}
                  transactions: {type: array, items: {type: object}}
                  balances: {type: array, items: {type: object}}
                  loans: {type: array, items: {type: object}}
                  products: {type: array, items: {type: object}}
                  needs: {type: array, items: {type: object}}
                  data_origin: {type: string, enum: [SYNTHETIC]}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/activity:
    get:
      summary: Фильтрованные итоги и страница операций компании
      description: Все суммы, месяцы, категории и страница операций используют один фильтр. Остаток определяется на конец периода и не меняется от типа операции. Только для клиента своей компании.
      parameters:
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {name: type, in: query, schema: {type: string, enum: [ALL, INCOME, EXPENSE], default: ALL}}
        - {name: category, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 12}}
      responses:
        '200':
          description: items, total, page, size, income, expenses, net, months, expense_categories, available_categories, balance, balance_date и balances
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnyObject'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/credit-load:
    get:
      summary: Кредиты и ближайшие платежи с независимыми страницами
      parameters:
        - {name: search, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string, enum: [ALL, EXISTING, ISSUED], default: ALL}}
        - {name: dueFrom, in: query, schema: {type: string, format: date}}
        - {name: dueTo, in: query, schema: {type: string, format: date}}
        - {name: loanPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: paymentPage, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 8}}
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/loans/{source}/{id}/name:
    put:
      summary: Сохранить личное название кредита
      description: Пустое название возвращает исходное. Проверяется принадлежность кредита компании клиента.
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters:
        - {name: source, in: path, required: true, schema: {type: string, enum: [EXISTING, ISSUED]}}
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, maxLength: 100}
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '403': {$ref: '#/components/responses/Error'}
  /finance/loans/{source}/{id}/payments:
    post:
      summary: Имитировать платёж по ближайшему взносу кредита
      description: Атомарно обновляет долг, счёт, график и историю операций. Повтор с тем же Idempotency-Key возвращает исходный платёж. Реальное списание не производится.
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters:
        - {name: source, in: path, required: true, schema: {type: string, enum: [EXISTING, ISSUED]}}
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_due_date]
              properties:
                expected_due_date: {type: string, format: date}
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '409': {$ref: '#/components/responses/conflict'}
  /finance/loans:
    get:
      summary: Действующие обязательства и кредиты, выданные через кабинет
      description: Сортировка по ближайшему списанию. source различает EXISTING и ISSUED. end_date рассчитывается от даты фактической выдачи; для старой записи без события выдачи может отсутствовать.
      responses:
        '200':
          description: Кредиты компании
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    company_id: {type: string}
                    name: {type: string}
                    remaining_debt: {type: number}
                    monthly_payment: {type: number}
                    rate: {type: number}
                    next_payment_date: {type: string, format: date}
                    end_date: {type: string, format: date}
                    source: {type: string, enum: [EXISTING, ISSUED]}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/sessions:
    post:
      summary: Вход по логину и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: {type: string, enum: [stable, gap, staff]}
                password: {type: string, format: password}
            example:
              login: stable
              password: Alfa2026!
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '401': {description: Неверный логин или пароль}
  /logout:
    post:
      summary: Завершить сессию
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /me:
    get:
      summary: Текущий аккаунт и CSRF-токен
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /dashboard:
    get:
      summary: Баланс, плановый прогноз и локальные материалы
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /insights:
    get:
      summary: Подборка гипотез — совместимый псевдоним GET /hypotheses
      responses:
        '200':
          description: Готовые карточки и статус фонового задания
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HypothesisList'}
  /hypotheses:
    get:
      summary: Получить гипотезы текущей компании и запустить обработку новой версии данных
      description: Не ждёт LLM. Повторный запрос использует существующее задание для того же снимка. Пока QUEUED/RUNNING, опрашивайте раз в 3 секунды; после завершения — раз в 15 секунд для обнаружения изменений.
      responses:
        '200':
          description: Карточки появляются по мере сохранения; EMPTY означает отсутствие обоснованных гипотез
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HypothesisList'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /hypotheses/refresh:
    post:
      summary: Повторить неудачное расширение гипотез или поставить новую версию данных в очередь
      description: READY и EMPTY для неизменившихся данных повторно не генерируются. Повтор PARTIAL/FAILED не дублирует карточки и уведомления.
      security: [{sessionCookie: [], csrfHeader: []}]
      responses:
        '202':
          description: Текущее состояние задания после запроса обработки
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HypothesisList'}
        '403': {$ref: '#/components/responses/Error'}
  /hypotheses/{id}:
    get:
      summary: Объяснение гипотезы, исходные факты и предварительные кредитные варианты
      parameters:
        - {$ref: '#/components/parameters/id'}
      responses:
        '200':
          description: Карточка своей компании, включая признак устаревших данных
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Hypothesis'}
        '404': {description: Гипотеза не существует или принадлежит другой компании}
  /notifications:
    get:
      summary: Последние 50 уведомлений о готовых гипотезах своей компании
      responses:
        '200':
          description: Прочтение хранится отдельно для каждой учётной записи
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/HypothesisNotification'}}
  /notifications/{id}/read:
    post:
      summary: Отметить уведомление прочитанным; повтор безопасен
      security: [{sessionCookie: [], csrfHeader: []}]
      parameters:
        - {$ref: '#/components/parameters/id'}
      responses:
        '200': {description: Уведомление отмечено прочитанным}
        '403': {$ref: '#/components/responses/Error'}
        '404': {description: Уведомление не существует или принадлежит другой компании}
  /cashflow/summary:
    get:
      summary: Доходы и расходы за шесть завершённых месяцев
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /synthetic/profiles:
    get:
      summary: Семь синтетических отраслевых профилей, доступно сотруднику
      responses:
        '200': {$ref: '#/components/responses/ok'}
        '403': {description: Клиенту недоступно}
  /cashflow/forecast:
    get:
      summary: Плановый прогноз по известным событиям
      parameters:
        - {name: horizon, in: query, schema: {type: string, enum: [30D, 6M]}}
        - {name: scenario, in: query, schema: {type: string, enum: [BASE, STRESS]}}
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /products:
    get:
      summary: Каталог учебных продуктов
      responses:
        '200': {$ref: '#/components/responses/ok'}
  /financing/goals:
    get:
      summary: Готовые цели кредита и соответствующие продукты
      responses:
        '200':
          description: Каталог целей клиента; OTHER отображается отдельным пунктом интерфейса
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CreditGoal'}}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /financing/resolve-goal:
    post:
      summary: Сопоставить готовую цель или свободное описание с направлением кредитования
      description: Не изменяет черновик. READY для свободного описания требует подтверждения пользователем. При неоднозначности возвращает вопрос без purpose. При недоступности модели используются консервативные правила и ручной выбор.
      security: [{sessionCookie: [], csrfHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal_id: {type: string, example: OTHER}
                text: {type: string, minLength: 5, maxLength: 500}
            examples:
              predefined: {value: {goal_id: STOCK}}
              freeText: {value: {goal_id: OTHER, text: 'Аренду нужно оплатить сейчас, а деньги от клиента придут через две недели'}}
      responses:
        '200':
          description: Предложенное направление, вопрос или сообщение об отсутствии подходящего направления
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoalResolution'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {description: Неизвестная цель или описание не от 5 до 500 символов}
  /financing/limits:
    get:
      summary: Доступные диапазоны суммы и срока по типу кредита и данным своей компании
      description: Предварительные демонстрационные ограничения; не являются одобрением. При отсутствии достаточной истории или доступного диапазона terms пуст. Расчёт котировки повторно проверяет ограничения и не создаёт quote_id вне диапазона (reason_code PERSONAL_LIMIT).
      parameters:
        - {name: purpose, in: query, required: true, schema: {type: string, enum: [EXPANSION, WORKING_CAPITAL, CASH_GAP]}}
        - {name: product_id, in: query, schema: {type: string}, description: Ограничить ответ одним продуктом соответствующего назначения}
        - {name: needed_by, in: query, schema: {type: string, format: date}, description: Дата получения от завтрашней демодаты до 120 дней вперёд; по умолчанию завтра}
      responses:
        '200':
          description: Точные диапазоны по каждому сроку и продукту
