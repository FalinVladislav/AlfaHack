  /quotes/{id}/business-scenarios:
    post:
      summary: Рассчитать три исхода с подтверждёнными зависимостями бизнеса
      description: Использует SALES/CASHFLOW из сохранённого плана, историю бизнеса и график нового кредита. Сохраняет снимок расчёта. Без LLM на этом шаге.
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_version]
              properties:
                plan_version: {type: integer, minimum: 1}
      responses:
        '200':
          description: Модель business-dependencies-v2. Формат трёх сценариев дополнен plan_version, business_plan, business_effects, horizon_months и метриками компонентов. scenarios[].funding_feasible=false означает нехватку денег на инвестиции; дальнейший операционный эффект остановлен. При пропусках или устаревшей истории INSUFFICIENT_DATA. Новые планы требуют сроков денежных потоков и проверяемых источников чисел; см. business-scenario-dialog.md.
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '409': {$ref: '#/components/responses/conflict'}
  /quotes/{id}/scenarios:
    post:
      summary: Три условных сценария бизнеса после кредита
      description: Сессия и CSRF. Ничего не сохраняет. Учитывает историю бизнеса, цель и график кредита. Сценарии не являются вероятностями. См. credit-scenarios.md.
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_cost: {type: number, minimum: 0, maximum: 1000000000, description: Бюджет проекта; по умолчанию сумма кредита кроме кассового разрыва}
                monthly_revenue: {type: number, minimum: 0, maximum: 1000000000, description: Дополнительная месячная выручка; передавать вместе с monthly_expenses}
                monthly_expenses: {type: number, minimum: 0, maximum: 1000000000, description: Все дополнительные месячные расходы}
                delay_months: {type: integer, minimum: 0, maximum: 24}
      responses:
        '200':
          description: READY с тремя сценариями либо INSUFFICIENT_DATA с пустым массивом scenarios
          content:
            application/json:
              schema:
                type: object
                required: [status, quote_id, scenarios]
                properties:
                  status: {type: string, enum: [READY, INSUFFICIENT_DATA]}
                  quote_id: {type: string}
                  model_version: {type: string}
                  project_effect_known: {type: boolean}
                  start_date: {type: string, format: date}
                  end_date: {type: string, format: date}
                  maturity_date: {type: string, format: date}
                  horizon_months: {type: integer, minimum: 12}
                  demo_clock: {type: boolean}
                  probabilities_available: {type: boolean, enum: [false]}
                  history_method: {type: string, enum: [LINEAR_TREND_RESIDUALS, LINEAR_TREND_SEASONAL_RESIDUALS]}
                  purpose: {type: string}
                  goal_text: {type: string, nullable: true}
                  inputs: {type: object, additionalProperties: true}
                  basis: {type: object, additionalProperties: true}
                  assumptions: {type: array, items: {type: string}}
                  message: {type: string}
                  scenarios:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, enum: [STRESS, BASE, OPTIMISTIC]}
                        title: {type: string}
                        revenue_change: {type: number}
                        ending_balance: {type: number}
                        without_credit_ending_balance: {type: number}
                        project_and_credit_delta: {type: number}
                        minimum_balance: {type: number}
                        without_credit_minimum_balance: {type: number}
                        gap_amount: {type: number}
                        first_negative_date: {type: string, format: date, nullable: true}
                        loan_payments: {type: number}
                        remaining_principal: {type: number}
                        funding_feasible: {type: boolean}
                        funding_shortfall: {type: number}
                        funding_failure_date: {type: string, format: date, nullable: true}
                        uncollected_project_revenue: {type: number}
                        prepaid_at_issue: {type: number}
                        project_monthly_revenue: {type: number}
                        project_monthly_expenses: {type: number}
                        benefit_start: {type: string, format: date}
                        project_revenue_factor: {type: number}
                        project_expense_factor: {type: number}
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              date: {type: string, format: date}
                              balance: {type: number}
                              without_credit: {type: number}
        '400': {description: Некорректные параметры экономики проекта}
        '409': {$ref: '#/components/responses/conflict'}
