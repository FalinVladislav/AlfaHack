server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:../data/credit;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql,classpath:finance-schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  demo-today: ${DEMO_TODAY:2026-10-21}
  secure-cookie: ${SECURE_COOKIE:false}
  model-api:
    url: ${MODEL_API_URL:}
    timeout-seconds: ${MODEL_API_TIMEOUT_SECONDS:70}
  insights:
    worker-enabled: ${INSIGHTS_WORKER_ENABLED:true}
    poll-millis: 2000
